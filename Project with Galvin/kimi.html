<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Chen | Creative Developer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #050505;
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.4);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--primary);
            color: #fff;
            overflow-x: hidden;
            cursor: none;
        }

        /* Custom Cursor */
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s;
            mix-blend-mode: difference;
        }

        .cursor-follower {
            position: fixed;
            width: 40px;
            height: 40px;
            background: var(--accent-glow);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            filter: blur(10px);
            transition: transform 0.3s ease-out;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, #0a0a0f 0%, #000 100%);
            perspective: 1000px;
        }

        /* 3D Reactive Object */
        .reactive-scene {
            position: relative;
            width: 400px;
            height: 400px;
            transform-style: preserve-3d;
        }

        /* Main Core */
        .core {
            position: absolute;
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .core-face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, 
                rgba(0, 212, 255, 0.1) 0%, 
                rgba(0, 212, 255, 0.05) 100%);
            border: 1px solid rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        /* Cube faces */
        .core-face:nth-child(1) { transform: translateZ(100px); }
        .core-face:nth-child(2) { transform: rotateY(180deg) translateZ(100px); }
        .core-face:nth-child(3) { transform: rotateY(90deg) translateZ(100px); }
        .core-face:nth-child(4) { transform: rotateY(-90deg) translateZ(100px); }
        .core-face:nth-child(5) { transform: rotateX(90deg) translateZ(100px); }
        .core-face:nth-child(6) { transform: rotateX(-90deg) translateZ(100px); }

        /* Inner Glow */
        .core-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            transform: translateZ(-50px);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translateZ(-50px) scale(1); }
            50% { opacity: 1; transform: translateZ(-50px) scale(1.2); }
        }

        /* Reactive Rings */
        .ring {
            position: absolute;
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease-out;
        }

        .ring:nth-child(1) { width: 300px; height: 300px; }
        .ring:nth-child(2) { width: 400px; height: 400px; }
        .ring:nth-child(3) { width: 500px; height: 500px; }

        /* Connection Lines to Cursor */
        .connection-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Content */
        .hero-content {
            position: absolute;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .hero-content h1 {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.05em;
            margin-bottom: 1rem;
        }

        .hero-content p {
            font-size: 1.25rem;
            color: #888;
            margin-bottom: 2rem;
        }

        .hero-content .btn {
            pointer-events: auto;
            display: inline-block;
            padding: 1rem 2.5rem;
            background: transparent;
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }

        .hero-content .btn:hover {
            background: #fff;
            color: #000;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* Sections */
        .projects {
            padding: 8rem 5%;
            background: #0a0a0a;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .project-card {
            background: #111;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #222;
            transition: all 0.3s;
        }

        .project-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .project-image {
            height: 200px;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
        }

        .project-content {
            padding: 1.5rem;
        }

        .tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent);
            border-radius: 20px;
            font-size: 0.75rem;
            margin-right: 0.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .reactive-scene {
                width: 300px;
                height: 300px;
            }
            .core {
                width: 150px;
                height: 150px;
            }
            .core-face {
                width: 150px;
                height: 150px;
            }
            .core-face:nth-child(1) { transform: translateZ(75px); }
            .core-face:nth-child(2) { transform: rotateY(180deg) translateZ(75px); }
            .core-face:nth-child(3) { transform: rotateY(90deg) translateZ(75px); }
            .core-face:nth-child(4) { transform: rotateY(-90deg) translateZ(75px); }
            .core-face:nth-child(5) { transform: rotateX(90deg) translateZ(75px); }
            .core-face:nth-child(6) { transform: rotateX(-90deg) translateZ(75px); }
        }
    </style>
</head>
<body>

    <!-- Custom Cursor -->
    <div class="cursor" id="cursor"></div>
    <div class="cursor-follower" id="follower"></div>

    <nav>
        <div class="logo">AC.</div>
        <ul class="nav-links">
            <li><a href="#work">Work</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="reactive-scene" id="scene">
            <!-- Expanding Rings -->
            <div class="ring" id="ring1"></div>
            <div class="ring" id="ring2"></div>
            <div class="ring" id="ring3"></div>
            
            <!-- Central Core -->
            <div class="core" id="core">
                <div class="core-face"></div>
                <div class="core-face"></div>
                <div class="core-face"></div>
                <div class="core-face"></div>
                <div class="core-face"></div>
                <div class="core-face"></div>
                <div class="core-glow"></div>
            </div>

            <!-- Canvas for cursor connections -->
            <canvas class="connection-canvas" id="connectionCanvas"></canvas>
        </div>

        <div class="hero-content">
            <h1>Alex Chen</h1>
            <p>Move your cursor to interact</p>
            <a href="#work" class="btn">View Work</a>
        </div>
    </section>

    <section class="projects" id="work">
        <div class="section-header">
            <h2>Selected Projects</h2>
        </div>
        <div class="project-grid">
            <div class="project-card">
                <div class="project-image"></div>
                <div class="project-content">
                    <span class="tag">React</span>
                    <span class="tag">WebGL</span>
                    <h3>Interactive Dashboard</h3>
                </div>
            </div>
            <div class="project-card">
                <div class="project-image"></div>
                <div class="project-content">
                    <span class="tag">Three.js</span>
                    <span class="tag">AI</span>
                    <h3>Neural Interface</h3>
                </div>
            </div>
            <div class="project-card">
                <div class="project-image"></div>
                <div class="project-content">
                    <span class="tag">Canvas</span>
                    <span class="tag">Motion</span>
                    <h3>Generative Art</h3>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Custom cursor
        const cursor = document.getElementById('cursor');
        const follower = document.getElementById('follower');
        
        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;
        let followerX = 0, followerY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Smooth cursor animation
        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.2;
            cursorY += (mouseY - cursorY) * 0.2;
            followerX += (mouseX - followerX) * 0.1;
            followerY += (mouseY - followerY) * 0.1;

            cursor.style.transform = `translate(${cursorX - 10}px, ${cursorY - 10}px)`;
            follower.style.transform = `translate(${followerX - 20}px, ${followerY - 20}px)`;

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // 3D Scene reaction
        const scene = document.getElementById('scene');
        const core = document.getElementById('core');
        const ring1 = document.getElementById('ring1');
        const ring2 = document.getElementById('ring2');
        const ring3 = document.getElementById('ring3');
        const canvas = document.getElementById('connectionCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Scene center
        let sceneRect = scene.getBoundingClientRect();
        let centerX = sceneRect.left + sceneRect.width / 2;
        let centerY = sceneRect.top + sceneRect.height / 2;

        window.addEventListener('scroll', () => {
            sceneRect = scene.getBoundingClientRect();
            centerX = sceneRect.left + sceneRect.width / 2;
            centerY = sceneRect.top + sceneRect.height / 2;
        });

        window.addEventListener('resize', () => {
            sceneRect = scene.getBoundingClientRect();
            centerX = sceneRect.left + sceneRect.width / 2;
            centerY = sceneRect.top + sceneRect.height / 2;
        });

        // Interactive animation
        function animateScene() {
            const rect = scene.getBoundingClientRect();
            const sceneCenterX = rect.left + rect.width / 2;
            const sceneCenterY = rect.top + rect.height / 2;

            // Calculate distance from mouse to scene center
            const deltaX = mouseX - sceneCenterX;
            const deltaY = mouseY - sceneCenterY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxDistance = 400;
            const intensity = Math.max(0, 1 - distance / maxDistance);

            // Rotate core based on mouse position
            const rotateY = (deltaX / window.innerWidth) * 60;
            const rotateX = -(deltaY / window.innerHeight) * 60;

            core.style.transform = `
                translate(-50%, -50%)
                rotateX(${rotateX}deg)
                rotateY(${rotateY}deg)
                scale(${1 + intensity * 0.2})
            `;

            // Deform rings based on proximity
            const ringScale = 1 + intensity * 0.3;
            const ringDeform = intensity * 20;

            ring1.style.transform = `
                translate(-50%, -50%)
                scale(${ringScale})
                rotateX(${rotateX * 0.5}deg)
                rotateY(${rotateY * 0.5}deg)
            `;
            ring1.style.borderRadius = `${50 + ringDeform}% ${50 - ringDeform}% ${50 + ringDeform}% ${50 - ringDeform}%`;

            ring2.style.transform = `
                translate(-50%, -50%)
                scale(${ringScale * 0.9})
                rotateX(${-rotateX * 0.3}deg)
                rotateY(${-rotateY * 0.3}deg)
            `;
            ring2.style.borderColor = `rgba(0, 212, 255, ${0.2 + intensity * 0.5})`;

            ring3.style.transform = `
                translate(-50%, -50%)
                scale(${ringScale * 0.8})
                rotateX(${rotateX * 0.2}deg)
                rotateY(${rotateY * 0.2}deg)
            `;
            ring3.style.borderWidth = `${1 + intensity * 2}px`;

            // Draw connection lines on canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (intensity > 0.1) {
                ctx.beginPath();
                ctx.moveTo(mouseX, mouseY);
                ctx.lineTo(sceneCenterX, sceneCenterY);
                ctx.strokeStyle = `rgba(0, 212, 255, ${intensity * 0.5})`;
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.stroke();

                // Draw energy points along the line
                const steps = 5;
                for (let i = 1; i < steps; i++) {
                    const t = i / steps;
                    const x = mouseX + (sceneCenterX - mouseX) * t;
                    const y = mouseY + (sceneCenterY - mouseY) * t;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, 3 * intensity, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 212, 255, ${intensity})`;
                    ctx.fill();
                }
            }

            // Core faces glow on proximity
            const faces = core.querySelectorAll('.core-face');
            faces.forEach((face, i) => {
                const glowIntensity = intensity * (0.3 + (i % 2) * 0.2);
                face.style.boxShadow = `
                    0 0 ${20 + intensity * 30}px rgba(0, 212, 255, ${glowIntensity}),
                    inset 0 0 ${20 + intensity * 20}px rgba(0, 212, 255, ${glowIntensity * 0.5})
                `;
                face.style.borderColor = `rgba(0, 212, 255, ${0.3 + intensity * 0.7})`;
            });

            requestAnimationFrame(animateScene);
        }
        animateScene();

        // Click interaction
        document.addEventListener('click', (e) => {
            // Create ripple effect at click position
            const ripple = document.createElement('div');
            ripple.style.position = 'fixed';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            ripple.style.width = '20px';
            ripple.style.height = '20px';
            ripple.style.border = '2px solid var(--accent)';
            ripple.style.borderRadius = '50%';
            ripple.style.transform = 'translate(-50%, -50%)';
            ripple.style.pointerEvents = 'none';
            ripple.style.animation = 'rippleExpand 0.6s ease-out forwards';
            document.body.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 600);
        });

        // Add ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes rippleExpand {
                to {
                    width: 100px;
                    height: 100px;
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>

</body>
</html>
