<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::after,
        *::before{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body{
            list-style: none;
            font-family: "Poppins";
        }

        .card{
            margin: 2rem;
            display: grid;
            gap: 1rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.5rem;
            width: 13rem;
            border: 1px solid rgb(193, 193, 193) ;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
            position: relative;
            background-color: white;
            transition: transform 0.25s ease;
        }

        main{
            display: grid;
            text-align: center;
            gap: 0.5rem;
        }

        .card::after{
            content: 'Shit, worked';
            font-size: 10pt;
            text-align: center;
            color: white;
            background:linear-gradient(to top,
            rgba(0, 0, 0, 0),
            steelblue
            );
            position: absolute;
            left: 0;
            top: 0;
            transform: scale(1);
            width: 100%;
            height: 100%;
            z-index: -1;
            border-radius: 0.5rem;
            transition: transform 0.2s ease-in-out, top 0.2s ease-in-out;
        }

        .card:hover::after{
            top: -20px;
            transform: scale(1.035);
        }

    </style>
</head>
<body>
    <div class="card">
        <header>THIS IS MAN</header>
        <main>
            <button id="btn">Nothing</button>
            <nav>
                <li>JAKE SULLY's WIFE</li>
                <li>BLUE PEACH</li>
                <li>RAVAN</li>
                <li>RANGER</li>
            </nav>
        </main>
        <footer>
            SOmething silly
        </footer>
    </div>
</body>
</html>
