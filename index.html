<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading</title>
    <style>
        body{
            font-family: "Poppins";
        }
    </style>
    <style>
        #wrap{
            width: 16rem;
            height: 16rem;
            background-color: thistle;
            margin: 1rem 0;
            border-radius: 0.5rem;
            border-bottom: 1px solid #FF6565;
        }
    </style>
</head>
<body>
    <div id="wrap"></div>
    <p id="OffsetDisplay">Width: </p>

    <script>
        const Box = document.getElementById('wrap');
        const offDisplay = document.getElementById('OffsetDisplay');

        function Update() {
            const currentWidth = Box.offsetWidth;
            offDisplay.textContent = `Width: ${currentWidth}px`;
            return `${5}px`; 
        }

        Box.style.borderBottomWidth = Update();
        Box.style.borderColor = '#FF6565';
    </script>
</body>
</html>
