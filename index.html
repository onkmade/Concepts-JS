<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body>
    <div class="bg-white min-h-svh flex justify-center items-center">
        <button id="openBtn" class="bg-black text-white p-2 rounded-md cursor-pointer hover:-translate-y-1 transition-all duration-300">Open</button>
    </div>

    <!-- Open Model -->
    <div class="modal bg-[#F0F2F5] p-2  max-w-100 text-center rounded-md absolute inset-0 m-auto h-fit space-y-3 shadow-md hidden">
        <h1 class="font-bold text-2xl">This is Heading</h1>
        <p class="text-sm">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Aliquid minus quos laboriosam pariatur dignissimos praesentium voluptatum alias enim debitis suscipit cum placeat eius deserunt odio, nemo blanditiis consequuntur dolorum beatae?
        </p>

        <button id="closeBtn" class="bg-black text-white p-2 rounded-md cursor-pointer hover:-translate-y-1 transition-all duration-300">Close</button>
    </div>

    <script>
        const modal = document.querySelector('.modal');
        const openBtn = document.getElementById('openBtn');
        const closeBtn = document.getElementById('closeBtn');


        openBtn.addEventListener('click', (e)=>{
            e.stopPropagation();
            modal.classList.remove('hidden');
        });

        closeBtn.addEventListener('click', (e)=>{
            e.stopPropagation();
            modal.classList.add('hidden');
        });

        document.addEventListener('click', (e)=>{
            const isOpen = !modal.classList.contains('hidden');

            if(isOpen && !modal.contains(e.target)){
                modal.classList.add('hidden');
            } 

            console.log('Nothing, Happended');
        });

    </script>
</body>
</html>
