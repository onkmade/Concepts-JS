<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neoman! sck it</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e0e0e0;
            margin: 0;
            font-family: "Poppins";
        }

        .card {
            background-color: #e0e0e0;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 10px 10px 30px #bebebe, -10px -10px 30px #ffffff;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tokens-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: #555;
        }

        .logo-icon {
            width: 16px;
            height: 16px;
            background-color: #4a90e2;
            border-radius: 50%;
        }

        .price {
            font-weight: 600;
            color: #333;
        }

        .counter-controls {
            display: flex;
            border-radius: 12px;
            overflow: hidden;
            background-color: #e0e0e0;
            box-shadow: inset 5px 5px 10px #bebebe, inset -5px -5px 10px #ffffff;
        }

        .button, .display {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            outline: none;
            transition: background-color 0.2s;
            font-size: 18px;
            font-weight: bold;
            color: #555;
            flex-grow: 1;
            text-align: center;
        }

        .button {
            background: none;
            box-shadow: 0px 0px 0px rgba(0,0,0,0);
        }

        .button:active {
            box-shadow: inset 2px 2px 5px #bebebe, inset -2px -2px 5px #ffffff;
        }

        .display {
            background-color: #333;
            color: #00bcd4;
            cursor: default;
            flex-grow: 2;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="tokens-info">
                <div class="logo-icon"></div>
                Tokens
            </div>
            <div class="price">
                $1.00
            </div>
        </div>
        <div class="counter-controls">
            <button class="button minus">—</button>
            <div class="display">1</div>
            <button class="button plus">+</button>
        </div>
    </div>
</body>
</html>
