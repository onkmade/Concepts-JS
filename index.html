<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/src/output.css">
</head>
<body>
    <div class="min-h-screen flex flex-col justify-center space-y-2 text-white items-center bg-black">
        <input id="searchInput" type="search" placeholder="Search Items" class="border border-white/50 p-2 rounded">
        <div class="list text-left">
            <div class="items">Pokemon</div>
            <div class="items">Nobita</div>
            <div class="items">Doraemon</div>
            <div class="items">Dujutsu Kaisen</div>
            <div class="items">Allen</div>
            <div class="items">Kleen</div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const items = document.querySelectorAll('.items');

        searchInput.addEventListener('input', (e)=>{
            const term = e.target.value.toLowerCase();

            items.forEach( item => {
                item.classList.add('hidden');
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(term) ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
