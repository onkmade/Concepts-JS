<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::after,
        *::before{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body{
            background-color: #e8eef7;
            text-decoration: none;
            list-style: none;
            font-family: "Poppins";
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100svh;
            flex-direction: column;
            padding: 2rem;
            transition: background-color 0.2s ease;
        }
        
        .wrap{
            color: #131215;
            background-color: white;
            flex: 1;
            width: 100%;
            padding: 1rem;
            border-radius: 1.275rem;
            border: 3px solid lightblue;
            border-style: dashed;
            text-align: center;
            display: grid;
            grid-template-rows: auto 1fr auto;
            transition: background-color 0.2s ease;
            place-content: center;
        }

        header p{
            font-size: 16pt;
        }

        main{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
        }

        button{
            user-select: none;
            width: fit-content;
            color: #131215;
            padding: 0.5rem;
            border: 2px solid #1312159c;
            outline: none;
            font-family: "JetBrains Mono";
            border-radius: 0.25rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
            background-color:white;
            
            &:hover{
                transform: scale(1.050);
                cursor: pointer;
            }
            
            &:active{
                transform: scale(1);
            }
        }

        .modal-backdrop{
            position: fixed;
            inset: 0;
            background-color: #36363647;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
        }

        .modal-card{
            background-color: white;
            padding: 0.5rem;
            border-radius: 0.5rem;
            height: 15rem;
            width: 15rem;
            display: grid;
            grid-template-rows: 1fr auto;
            box-shadow: 0px 1px 3px rgb(0,0,0,0.1);
            opacity: 0;
            visibility: hidden;
            pointer-events: auto;
            transform: scale(0.9) translateY(10px);
            transition: transform 0.25s ease, opacity 0.25s ease;

            p{
                display: grid;
                place-content: center;
            }

            .button{
                display: grid;
                place-content: center;
            }
        }

        .card-active{
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: scale(1) translateY(0);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <p>Modal Pop-up window</p>
        </header>
        <main>
            <button id="open">Open</button>
        </main>
        <footer></footer>
    </div>

    <div class="modal-backdrop">
        <div class="modal-card">
            <p>This is the pop-up card</p>
            <div class="button">
                <button id="close">Close</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () =>{

            const openBtn = document.getElementById('open');
            const closeBtn = document.getElementById('close');
            const backdropModal = document.querySelector('.modal-backdrop');
            const modalCard = document.querySelector('.modal-card');
            
            openBtn.addEventListener('click', ()=>{
                backdropModal.classList.add('card-active');
                modalCard.classList.add('card-active');
            });

            const close = () => {
                backdropModal.classList.remove('card-active');
                modalCard.classList.remove('card-active');
            };

            closeBtn.addEventListener('click', close);

            backdropModal.addEventListener('click', (e)=>{
                if( e.target === backdropModal) close();
                console.log(e.target, e.currentTarget);
            });
            console.log(openBtn, backdropModal, modalCard);
        });
    </script>
</body>
</html>
