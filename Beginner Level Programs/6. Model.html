<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::after,
        *::before{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body{
            background-color: #e8eef7;
            text-decoration: none;
            list-style: none;
            font-family: "Poppins";
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100svh;
            flex-direction: column;
            padding: 2rem;
            transition: background-color 0.2s ease;
        }
        
        .wrap{
            color: #131215;
            background-color: white;
            flex: 1;
            width: 100%;
            padding: 1rem;
            border-radius: 1.275rem;
            border: 3px solid lightblue;
            border-style: dashed;
            text-align: center;
            display: grid;
            grid-template-rows: auto 1fr auto;
            transition: background-color 0.2s ease;
            place-content: center;
        }

        header p{
            font-size: 16pt;
        }

        main{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <p></p>
        </header>
        <main>
            
        </main>
        <footer></footer>
    </div>
</body>
</html>
