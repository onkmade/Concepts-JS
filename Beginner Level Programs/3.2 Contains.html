<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contains() method</title>
    <style>
        *,
        *::after,
        *::before{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body{
            background-color: #e8eef7;
            text-decoration: none;
            list-style: none;
            font-family: "Poppins";
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100svh;
            flex-direction: column;
            padding: 2rem;
            transition: background-color 0.2s ease;
        }
        
        .wrap{
            color: #131215;
            background-color: white;
            flex: 1;
            width: 100%;
            padding: 1rem;
            border-radius: 1.275rem;
            border: 3px solid lightblue;
            border-style: dashed;
            text-align: center;
            display: grid;
            grid-template-rows: auto 1fr auto;
            transition: background-color 0.2s ease;
            place-content: center;
        }

        header p{
            font-size: 16pt;
        }

        main{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
        }
        
        .box{
            box-shadow: 0 0 0 2px rgb(255, 154, 154);
            width: 12rem;
            height: 12rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            place-content: center;
        }
        
        button{
            width: fit-content;
            background: none;
            color: #131215;
            padding: 0.5rem;
            border: 2px solid #1312159c;
            outline: none;
            font-family: "JetBrains Mono";
            border-radius: 0.25rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
            
            &:hover{
                transform: scale(1.050);
                cursor: pointer;
            }
        }
        
        .active{
            background-color: white;
            box-shadow:0 0 0 2px rgb(155, 171, 219);
            border: 2px solid #f0f2f5;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <p>Learning Contains Method ClassList</p>
        </header>
        <main>
            <div class="box">
                THIS IS THE BOX
            </div>
            <p id="message"></p>
        </main>
        <footer>
            <button id="btn">Button</button>
        </footer>
    </div>

    <script>
        const box = document.querySelector('.box');
        const btn = document.getElementById('btn');
        const message = document.getElementById('message');

        btn.addEventListener('click', ()=> {
            console.log(event.target);
            box.classList.toggle('active');
            box.textContent = box.textContent === 'Activate' ? 'Deactiviate' : 'Activate';
            if(box.classList.contains('active')){
                message.textContent = "The Box has been activated";
            } else {
                message.textContent = 'The Box has been deactivated';
            }
        });
    </script>
</body>
</html>
