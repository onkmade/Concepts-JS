<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>getBoundingClientRect Example</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .box{
            width: 20rem;
            height: 10rem;
            background-color: thistle;
            border-radius: 0.5rem;
        }

        .text{
            width: 100%;
            text-align: left;
            display: grid;
            gap: 0.35rem;
            p{
                display: flex;

            }
        }

        strong{
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <p>getBoundingClientRect Example</p>
        </header>
        <main>
            <div class="box" id="box"></div>
            <div class="text">
                <p>Left Position: <strong id="left">?</strong></p>
                <p>Right Position: <strong id="right">?</strong></p>
                <p>Top Position: <strong id="top">?</strong></p>
                <p>Bottom Position: <strong id="bottom">?</strong></p>
                <p>x Position: <strong id="x">?</strong></p>
                <p>y Position: <strong id="y">?</strong></p>
                <p>width: <strong id="width">?</strong></p>
                <p>height <strong id="height">?</strong></p>
            </div>
        </main>
        <footer>
            <button id="show">show</button>
        </footer>
    </div>

    <script>
        const box = document.getElementById('box');
        const showBtn =document.getElementById('show');

        console.log(box.getBoundingClientRect());
        const b = box.getBoundingClientRect();

        showBtn.addEventListener('click', ()=>{
            document.getElementById('left').textContent = Math.round(b.left) + 'px';
            document.getElementById('right').textContent = Math.round(b.right) + 'px';
            document.getElementById('top').textContent = Math.round(b.top) + 'px';
            document.getElementById('bottom').textContent = Math.round(b.bottom) + 'px';
            document.getElementById('x').textContent = Math.round(b.x) + 'px';
            document.getElementById('y').textContent = Math.round(b.y) + 'px';
            document.getElementById('width').textContent = Math.round(b.width) + 'px';
            document.getElementById('height').textContent = Math.round(b.height) + 'px';

            console.log(box.offsetWidth);
            console.log(box.clientWidth);
            console.log(box.scrollHeight);
        });
    </script>
</body>
</html>
