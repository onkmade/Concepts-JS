<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Properties</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .box{
            width: 25rem;
            height: 20rem;
            border-radius: 0.5rem;
            display: grid;
            /* place-content: center; */
            padding: 0.5rem;
            border: 3px solid rgb(160, 159, 159);
            border-style: dotted;
            position: relative;
            overflow: hidden;
        }

        #ball{
            width: 5rem;
            height: 5rem;
            background-color: orange;
            border-radius: 100%;
            position:sticky;
            left: 0;
            top: 0;
        }

        svg{
            width: 20px;
            height: 20px;
            vertical-align: middle;
            color: #333235;
        }

        .button-grid{
            width: fit-content;
            display: grid;
            gap: 0.25rem;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        footer{
            display: grid;
            place-content: center;
        }

        button{
            &:active{
                border-color:steelblue;
                
                svg{
                    color: steelblue;
                }
            }
        }
        
        #top{ order: 2;}
        #down{ order: 8;}
        #left{ order: 4;}
        #right{ order: 6;}
        #reset {order: 5;}

        .empty-1 {order: 1;}
        .empty-2 {order: 3;}
        .empty-4 {order: 9;}
        .empty-3 {order: 7;}
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <p>Size Properties of DOM</p>
        </header>
        <main>
            <div class="box">
                <div id="ball"></div>
            </div>
        </main>
        <footer>
            <div class="button-grid">
                <div class="empty-1"></div>
                <button onclick="moveLeft()" id="left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <div class="empty-2"></div>
                <button onclick="moveRight()" id="right">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
                </button>
                <button onclick="resetBall()" id="reset">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw-icon lucide-rotate-ccw"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
                <div class="empty-3"></div>
                <button onclick="moveTop()" id="top">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-up-icon lucide-chevron-up"><path d="m18 15-6-6-6 6"/></svg>
                </button>
                <button onclick="moveDown()" id="down">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down-icon lucide-chevron-down"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="empty-4"></div>
            </div>
        </footer>
    </div>

    <script>
        const box = document.querySelector('.box');
        const ball = document.getElementById('ball');
        const leftBtn = document.getElementById('left');
        const rightBtn = document.getElementById('right');

        
        function moveLeft(){
            let currentValue = ball.offsetLeft;
            ball.style.left = (currentValue - 20) + 'px';
        }

        function moveRight(){
            let currentValue = ball.offsetLeft;
            ball.style.left = (currentValue + 20) + 'px';
        }

        function moveTop(){
            let currentValue = ball.offsetTop;
            ball.style.top = (currentValue - 20) + 'px';
        }

        function moveDown(){
            let currentValue = ball.offsetTop;
            ball.style.top = (currentValue + 20) + 'px';
        }

        function resetBall(){
            ball.style.left = '0';
            ball.style.top = '0';
        }
    </script>
</body>
</html>
