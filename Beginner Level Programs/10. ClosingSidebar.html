<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar</title>
    <style>
        *,
        *::after,
        *::before{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body{
            font-family: "Poppins";
            text-decoration: none;
            background-color: #F0F2F5;
        }

        .wrap{
            display: flex;
        }

        .main-container{
            flex: 1;
            margin: 0.5rem 0.5rem 0.5rem 0;
            border: 2px solid #363636;
            background-color: #1E1E1E;
            border-radius: 0.5rem;
        }
        
        .sidebar{
            margin: 0.5rem;
            border-radius: 0.5rem;
            width: 16rem;
            background-color: #1E1E1E;
            border: 2px solid #363636;
            height: calc(100svh - 1rem);
            color: #F0F0F0;
            transition: width 0.5s ease-in-out;

            svg{
                flex-shrink: 0;
            }
        }

        header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            margin-bottom: 2rem;

            p{
                opacity: 1;
                transition: opacity 0.6s ease-in-out;
            }
        }

        header button{
            background: none;
            outline: transparent;
            border: none;
            color: #F0F0F0;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            transform: rotate(180deg);
            transition: transform 0.5s ease-in-out;
        }
        
        .items{
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            background-color: #363636;
            margin: 0.35rem;
            border-radius: 0.35rem;

            p{
                transition: opacity 0.6s ease-in-out;
            }
        }
            
        .items svg{
            width: 20px;
            height: 20px;
            vertical-align: middle;
            transition: width 0.6s ease, height 0.3s ease;
        }
            
        .active{
            
            &.sidebar{
                width: 3rem;
                overflow: hidden;
            }


            header{
                display: grid;
                place-content: center;

                p{
                    display: none;
                    opacity: 0;
                }

                button{
                    transform: rotate(0);
                }
            }
    
            .items{
                & p{
                    opacity: 0;
                    overflow: hidden;
                }
            }
                
            .items svg{
                width: 18px;
                height: 18px;
                vertical-align: middle;
            }
        }   
        
    </style>
</head>
<body>
    <div class="wrap">
        <aside class="sidebar">
            <header>
                <p>LOGO</p>
                <button class="close-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-panel-right-close-icon lucide-panel-right-close"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/><path d="m8 9 3 3-3 3"/></svg>
                </button>
            </header>
            <nav>
                <li class="items">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-icon lucide-file"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/></svg>
                    <p>
                        Options                 
                    </p>
                </li>
                <li class="items">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-icon lucide-file"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/></svg>
                    <p>
                        Options
                    </p>
                </li>
                <li class="items">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-icon lucide-file"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/></svg>
                    <p>
                        Options
                    </p>
                </li>
                <li class="items">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-icon lucide-file"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/></svg>
                    <p>
                        Options
                    </p>
                </li>
            </nav>
        </aside>
        <main class="main-container">

        </main>
    </div>

    <script>
        const sidebar = document.querySelector('.sidebar');
        const items = document.querySelectorAll('.items');
        const closeBtn = document.querySelector('.close-btn');

        closeBtn.addEventListener('click', ()=> {
            sidebar.classList.toggle('active');
        });
    </script>
</body>
</html>
