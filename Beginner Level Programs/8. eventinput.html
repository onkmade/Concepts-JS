<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        #search-input{
            width: 25rem;
            color: #131215;
            padding: 0.5rem;
            border: 2px solid #1312159c;
            outline: none;
            font-family: "JetBrains Mono";
            border-radius: 0.25rem;
        }

        .search{
            position: fixed;
            border-radius: 0.25rem;
        }

        #heading{
            font-size: 20pt;
            color: darkseagreen;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <p>Learning inputs</p>
        </header>
        <main>
            <p id="heading"></p>
            <input type="text" id="search-input" placeholder="Type Your Name">
            <input type="checkbox" name="" id="checkbox">
            <p id="message"></p>
        </main>
        <footer></footer>
    </div>

    <script>
        const searchInput = document.getElementById('search-input');
        const checkbox = document.getElementById('checkbox');
        const heading = document.getElementById('heading');

        searchInput.addEventListener('input', (e) => {
            // console.log(`Event Type: ${event.type}`); // Input
            // console.log(`Input Type: ${event.inputType}`); // insertText
            // console.log(`Data Inserted: ${event.data}`); // Each letter when typing
            console.log(`Current Value: ${event.target.value}`); //complete word
            heading.innerHTML = `Hello, ${e.target.value}`;
        });

        searchInput.addEventListener('change',(e)=>{
            console.log(`Change event: ${event.target.value}`);
        });


        checkbox.addEventListener('change', (e) =>{
            let query = checkbox.checked;
            if(query){
                document.getElementById('message').textContent = `checkbox is clicked`;
            } else {
                document.getElementById('message').textContent = `checkbox is not clicked`;
            }
        });
    </script>
</body>
</html>
